<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190">
<defs>
  <linearGradient id="bg" x1="0" x2="1">
    <stop offset="0" stop-color="#06090F"/>
    <stop offset=".55" stop-color="#0B1118"/>
    <stop offset="1" stop-color="#07101A"/>
  </linearGradient>
  <linearGradient id="scan">
    <stop offset="0" stop-color="#58A6FF" stop-opacity="0"/>
    <stop offset=".5" stop-color="#79C0FF"/>
    <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .sans{font-family:Inter,"Segoe UI",Arial,sans-serif}
    .mono{font-family:"Fira Code",Consolas,monospace}
  </style>
</defs>

<rect width="1200" height="190" rx="20" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="188" rx="19" fill="none" stroke="#263244"/>

<!-- terminal top bar -->
<circle cx="34" cy="28" r="4" fill="#58A6FF">
  <animate attributeName="opacity" values=".3;1;.3" dur="1.8s" repeatCount="indefinite"/>
</circle>
<text x="49" y="33" class="mono" font-size="11" fill="#64748B">PORTFOLIO_INTERFACE :: ONLINE</text>
<text x="1160" y="33" text-anchor="end" class="mono" font-size="10" fill="#475569">AI / ML</text>

<!-- scan brackets -->
<g stroke="#58A6FF" stroke-width="1.6" fill="none" opacity=".6">
 <path d="M115 62h30M115 62v22"/>
 <path d="M1085 62h-30M1085 62v22"/>
 <path d="M115 150h30M115 150v-22"/>
 <path d="M1085 150h-30M1085 150v-22"/>
</g>

<!-- welcome -->
<text x="600" y="93" text-anchor="middle" class="sans"
      font-size="35" font-weight="700" fill="#F8FAFC">
  Welcome to my AI Engineering Portfolio
</text>

<text x="600" y="123" text-anchor="middle" class="mono"
      font-size="13" fill="#94A3B8">
  Generative AI  •  LLM Systems  •  RAG  •  NLP  •  Cloud AI
</text>

<!-- animated scanner -->
<rect x="320" y="144" width="560" height="2" fill="#263244"/>
<rect x="320" y="143" width="120" height="4" rx="2" fill="url(#scan)" filter="url(#glow)">
  <animate attributeName="x" values="320;760;320" dur="4.4s" repeatCount="indefinite"/>
</rect>

<!-- lower system line -->
<text x="600" y="171" text-anchor="middle" class="mono"
      font-size="10" letter-spacing="1.2" fill="#526174">
  RESEARCH  →  ENGINEERING  →  EVALUATION  →  DEPLOYMENT
</text>
</svg>