<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="105" viewBox="0 0 1200 105">
<defs>
  <linearGradient id="trail" x1="0" x2="1">
    <stop offset="0" stop-color="#38BDF8" stop-opacity="0"/>
    <stop offset=".5" stop-color="#60A5FA" stop-opacity=".75"/>
    <stop offset="1" stop-color="#818CF8" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="2.3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<!-- transparent background -->

<!-- faint orbital path -->
<path d="M100 53 C310 15 420 92 600 53 C780 14 900 91 1100 53"
      fill="none" stroke="#263244" stroke-width="1.2" stroke-dasharray="5 9"/>

<!-- small data sparkles -->
<g fill="#64748B">
  <circle cx="205" cy="37" r="1.6">
    <animate attributeName="opacity" values=".15;.9;.15" dur="2.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="392" cy="69" r="1.4">
    <animate attributeName="opacity" values=".8;.15;.8" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="805" cy="35" r="1.5">
    <animate attributeName="opacity" values=".2;1;.2" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1000" cy="67" r="1.5">
    <animate attributeName="opacity" values="1;.15;1" dur="3s" repeatCount="indefinite"/>
  </circle>
</g>

<!-- animated tiny rocket -->
<g filter="url(#glow)">
  <animateMotion dur="8s" repeatCount="indefinite"
    rotate="auto"
    path="M100 53 C310 15 420 92 600 53 C780 14 900 91 1100 53"/>

  <!-- exhaust -->
  <path d="M-21 0 L-36 -5 L-30 0 L-36 5 Z" fill="#38BDF8" opacity=".55">
    <animate attributeName="opacity" values=".25;.8;.25" dur=".55s" repeatCount="indefinite"/>
  </path>

  <!-- rocket body -->
  <path d="M-18 -9 C-2 -17 15 -12 26 0 C15 12 -2 17 -18 9 Z"
        fill="#111827" stroke="#93C5FD" stroke-width="1.5"/>
  <path d="M-8 -10 L-17 -20 L2 -13 Z" fill="#1E3A5F" stroke="#60A5FA" stroke-width="1"/>
  <path d="M-8 10 L-17 20 L2 13 Z" fill="#1E3A5F" stroke="#60A5FA" stroke-width="1"/>
  <circle cx="8" cy="0" r="5" fill="#07111F" stroke="#7DD3FC" stroke-width="1.2"/>
  <circle cx="8" cy="0" r="2" fill="#7DD3FC">
    <animate attributeName="opacity" values=".35;1;.35" dur="1.1s" repeatCount="indefinite"/>
  </circle>
</g>

<!-- travelling light trail -->
<rect x="-70" y="-1.5" width="70" height="3" rx="1.5" fill="url(#trail)">
  <animateMotion dur="8s" repeatCount="indefinite"
    rotate="auto"
    path="M100 53 C310 15 420 92 600 53 C780 14 900 91 1100 53"/>
</rect>

</svg>